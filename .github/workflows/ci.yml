name: Build, Test, Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # 1. BUILD DOCKER IMAGE AND PUSH TO DOCKER HUB
  # ==========================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-website:latest
            ${{ secrets.DOCKER_USERNAME }}/my-website:${{ github.sha }}


  # ==========================================
  # 3. DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Starting deployment..."

            cd ~/my-website

            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/my-website:latest

            echo "Stopping old container..."

            docker compose down || true

            echo "Starting new container..."

            docker compose up -d

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Deployment completed!"

            docker ps
```
