
name: Build, Test, Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ========================================
  # 1. TEST THE APPLICATION
  # =========================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Use this section if your website is Node.j

  # ==========================================
  # 2. BUILD DOCKER IMAGE AND PUSH TO DOCKER HUB
  # ==========================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-website:latest
            ${{ secrets.DOCKER_USERNAME }}/my-website:${{ github.sha }}
   
  # ==========================================
  # 3. DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
  
            echo "================================="
            echo "Starting deployment"
            echo "================================="
  
            # --------------------------------
            # 1. Create application directory
            # --------------------------------
            echo "Creating application directory..."
  
            mkdir -p ~/my-website
  
            cd ~/my-website
  
            # --------------------------------
            # 2. Create docker-compose.yml
            # --------------------------------
            echo "Creating docker-compose.yml..."
  
            cat > docker-compose.yml << EOF
            services:
              website:
                image: ${{ secrets.DOCKER_USERNAME }}/my-website:latest
                container_name: my-website
                ports:
                  - "80:80"
                restart: unless-stopped
            EOF
  
            # --------------------------------
            # 3. Pull latest Docker image
            # --------------------------------
            echo "Pulling latest Docker image..."
  
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-website:latest
  
            # --------------------------------
            # 4. Stop old container
            # --------------------------------
            echo "Stopping old container..."
  
            docker compose down || true
  
            # --------------------------------
            # 5. Start new container
            # --------------------------------
            echo "Starting new container..."
  
            docker compose up -d
  
            # --------------------------------
            # 6. Remove unused images
            # --------------------------------
            echo "Cleaning unused Docker images..."
  
            docker image prune -f
  
            # --------------------------------
            # 7. Show running containers
            # --------------------------------
            echo "Running containers:"
  
            docker ps
  
            echo "================================="
            echo "Deployment completed successfully"
            echo "================================="
